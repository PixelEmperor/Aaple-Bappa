allowBuilds:
  '@sentry/cli': true
  core-js: true
  sharp: false
  unrs-resolver: false

# Transitive-only advisories whose vulnerable ranges sit behind pinned
# parents, so a plain `pnpm update` can't reach them:
#   fast-uri  — SSRF / host confusion, reached via
#               @sentry/nextjs > @sentry/webpack-plugin > webpack > ajv.
#               Build-toolchain only, no runtime path.
#   nanoid    — unbounded loop with a custom generator; same build-time tree.
#   sharp     — libheif advisories (GHSA-rgj7-g3m4-5g8c). This one IS on a
#               runtime path: next/image uses sharp to optimize the
#               user-uploaded mandal photos served from R2.
#   js-yaml   — maxTotalMergeKeys doesn't bound CPU on empty merge sources
#               (GHSA-2883-xcg3-v3hh), reached via eslint > @eslint/eslintrc,
#               which pins 4.3.1. Lint-time only — no runtime path, and the
#               only YAML it parses is our own config.
# Overrides live here rather than in package.json because pnpm 10+ reads them
# from the workspace file.
overrides:
  fast-uri: '>=3.1.6'
  js-yaml: '>=4.3.2'
  nanoid: '>=3.3.18'
  sharp: '>=0.35.4'
