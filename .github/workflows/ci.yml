name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: apps/web

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Explicit version, not auto-detected from packageManager: that field
      # lives in apps/web/package.json, but this step is a `uses:` action,
      # not a `run:` step, so the `defaults.run.working-directory` above
      # doesn't apply to it — it only ever looks at the repo root, where
      # there's deliberately no package.json (single-package repo).
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Next.js 16 generates ambient LayoutProps/PageProps types under
      # .next/types on a build or dev run — on a fresh checkout, with no
      # .next/ yet and Build running after Typecheck below, `tsc` has
      # nothing to resolve those against without this step.
      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Runtime dependencies only: --prod excludes the build toolchain, where
      # a transitive advisory in e.g. webpack's schema-utils chain has no
      # production code path and would otherwise block every PR.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # Separate job so a finding here doesn't hide a test failure, and vice versa.
  secret-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks diffs the pushed range, so it needs history, not just
          # the tip commit actions/checkout fetches by default.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
